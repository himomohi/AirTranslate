name: Release Verify

on:
  push:
    branches:
      - master
      - "codex/release-airtranslate-*"
  workflow_dispatch:

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and package
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Load app metadata
        id: metadata
        run: |
          source script/app_metadata.sh
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Verify release lineage
        run: git merge-base --is-ancestor v1.5.1 HEAD

      - name: Verify packaging permissions
        run: ./script/verify_packaging_permissions.sh

      - name: Stress metadata-grace regression
        run: |
          set -o pipefail
          for attempt in {1..20}; do
            echo "Metadata-grace regression attempt $attempt/20"
            attempt_log="/tmp/airtranslate-metadata-grace-$attempt.log"
            swift test \
              --filter 'orphanTerminalRecoversAfterElapsedMetadataGrace|terminalWithMissingPredecessorRecoversAfterElapsedMetadataGrace' \
              2>&1 | tee "$attempt_log"
            if grep -Fq 'No matching test cases were run' "$attempt_log"; then
              echo "Metadata-grace regression filter matched no tests." >&2
              exit 1
            fi
            if ! grep -Eq 'Test run with 2 tests in 1 suite passed' "$attempt_log"; then
              echo "Metadata-grace regression attempt did not execute exactly two tests." >&2
              exit 1
            fi
            rm "$attempt_log"
          done

      - name: Stress restored settings isolation
        run: |
          set -o pipefail
          for attempt in {1..20}; do
            echo "Restored-settings isolation attempt $attempt/20"
            attempt_log="/tmp/airtranslate-restored-settings-$attempt.log"
            swift test \
              --filter 'restoredGeminiTranscriptionPreservesFloatingCaptionPreference' \
              2>&1 | tee "$attempt_log"
            if grep -Fq 'No matching test cases were run' "$attempt_log"; then
              echo "Restored-settings isolation filter matched no tests." >&2
              exit 1
            fi
            if ! grep -Eq 'Test run with 1 test in 1 suite passed' "$attempt_log"; then
              echo "Restored-settings isolation attempt did not execute exactly one test." >&2
              exit 1
            fi
            rm "$attempt_log"
          done

      - name: Run full test suite
        run: swift test

      - name: Build release configuration
        run: swift build -c release

      - name: Build release artifacts
        run: ./Release/build_open_source_release.sh all

      - name: Verify disk images and checksums
        run: |
          hdiutil verify "Release/product/$APP_NAME.dmg"
          hdiutil verify "Release/product/$APP_NAME-$VERSION.dmg"
          cd Release/product
          shasum -a 256 -c "$APP_NAME.dmg.sha256"
          shasum -a 256 -c "$APP_NAME-$VERSION.dmg.sha256"

      - name: Verify bundle and archive contents
        run: |
          app="Release/product/$APP_NAME.app"
          info="$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$info")" = "$VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$info")" = "$BUILD_NUMBER"

          codesign -d --entitlements :- "$app" 2>&1 \
            | sed -n '/^<?xml/,/<\/plist>/p' \
            > /tmp/airtranslate-release-entitlements.plist
          test -s /tmp/airtranslate-release-entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' /tmp/airtranslate-release-entitlements.plist)" = "true"
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' /tmp/airtranslate-release-entitlements.plist >/dev/null 2>&1; then
            echo "Release app must not contain get-task-allow." >&2
            exit 1
          fi

          scan_root="$(mktemp -d)"
          mount_point="$scan_root/mount"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rm -rf "$scan_root"' EXIT
          mkdir -p "$scan_root/build-zip" "$scan_root/stable-zip" "$mount_point"
          ditto -x -k "Release/product/$APP_NAME-$VERSION-$BUILD_NUMBER.zip" "$scan_root/build-zip"
          ditto -x -k "Release/product/$APP_NAME-$VERSION.zip" "$scan_root/stable-zip"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "Release/product/$APP_NAME.dmg"

          for root in "$scan_root/build-zip" "$scan_root/stable-zip" "$mount_point"; do
            test -d "$root/$APP_NAME.app"
            test -f "$root/$APP_NAME.app/Contents/Resources/LICENSE"
            test -f "$root/$APP_NAME.app/Contents/Resources/NOTICE"
            test -f "$root/$APP_NAME.app/Contents/Resources/AppIcon.icns"
          done

          diff -rq "$scan_root/build-zip/$APP_NAME.app" "$scan_root/stable-zip/$APP_NAME.app"
          cmp "Release/product/$APP_NAME.dmg" "Release/product/$APP_NAME-$VERSION.dmg"

          if find "$scan_root/build-zip" "$scan_root/stable-zip" "$mount_point" \
            -type f \( -name '.env' -o -name '*.p12' -o -name '*.mobileprovision' \
            -o -name '*.provisionprofile' -o -name '*.key' \) -print | grep -q .; then
            echo "Sensitive file found in release artifacts." >&2
            exit 1
          fi

          secret_pattern='(xai-[A-Za-z0-9_-]{20,}|XAI_API_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]+|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]+|GEMINI_API_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]+|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----)'
          set +e
          /usr/bin/grep -aERq \
            "$secret_pattern" \
            "$scan_root/build-zip/$APP_NAME.app" \
            "$scan_root/stable-zip/$APP_NAME.app" \
            "$mount_point/$APP_NAME.app"
          scan_status=$?
          set -e
          if [[ "$scan_status" -eq 0 ]]; then
            echo "Secret pattern found in release artifacts." >&2
            exit 1
          fi
          if [[ "$scan_status" -ne 1 ]]; then
            echo "Secret scanner failed with status $scan_status." >&2
            exit "$scan_status"
          fi

      - name: Upload verified release set
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AirTranslate-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.build_number }}-release-set
          path: |
            Release/product/AirTranslate-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.build_number }}.zip
            Release/product/AirTranslate-${{ steps.metadata.outputs.version }}.zip
            Release/product/AirTranslate.dmg
            Release/product/AirTranslate.dmg.sha256
            Release/product/AirTranslate-${{ steps.metadata.outputs.version }}.dmg
            Release/product/AirTranslate-${{ steps.metadata.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 7
